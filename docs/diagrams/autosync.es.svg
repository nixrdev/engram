<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1280 720"><defs><marker id="ar-gr" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a6e3a1" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ar-y" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#f9e2af" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ar-p" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#fab387" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ar-bl" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#89b4fa" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="1280" height="720" fill="#1e1e2e"/><text x="640" y="90" fill="#cdd6f4" font-size="48" font-weight="800" text-anchor="middle">Ciclo de Vida del Autosync</text><text x="640" y="125" fill="#a6adc8" font-size="20" text-anchor="middle">Inactivo → Ejecutando → (Saludable o Degradado) → vuelve a Inactivo.</text><g transform="translate(120,330)"><rect width="200" height="120" fill="#45475a" stroke="#89b4fa" stroke-width="3" rx="14"/><text x="100" y="56" fill="#89b4fa" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">ESPERANDO</text><text x="100" y="92" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Inactivo</text></g><g transform="translate(540,330)"><rect width="200" height="120" fill="#89b4fa22" stroke="#89b4fa" stroke-width="3" rx="14"/><text x="100" y="56" fill="#89b4fa" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">CICLO EN VUELO</text><text x="100" y="92" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Ejecutando</text></g><g transform="translate(960,210)"><rect width="200" height="120" fill="#a6e3a122" stroke="#a6e3a1" stroke-width="3" rx="14"/><text x="100" y="56" fill="#a6e3a1" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">ÉXITO</text><text x="100" y="92" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Saludable</text></g><g transform="translate(960,450)"><rect width="200" height="120" fill="#f9e2af22" stroke="#f9e2af" stroke-width="3" rx="14"/><text x="100" y="56" fill="#f9e2af" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">FALLA</text><text x="100" y="92" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Degradado</text></g><line x1="320" x2="538" y1="390" y2="390" stroke="#89b4fa" stroke-width="3" marker-end="url(#ar-bl)"/><text x="429" y="375" fill="#89b4fa" font-size="16" font-weight="600" text-anchor="middle">tick</text><text x="429" y="410" fill="#a6adc8" font-size="13" text-anchor="middle">cada 30s</text><line x1="660" x2="958" y1="335" y2="270" stroke="#a6e3a1" stroke-width="3" marker-end="url(#ar-gr)"/><text x="800" y="280" fill="#a6e3a1" font-size="16" font-weight="600" text-anchor="middle">ok</text><line x1="660" x2="958" y1="445" y2="510" stroke="#f9e2af" stroke-width="3" marker-end="url(#ar-y)"/><text x="800" y="500" fill="#f9e2af" font-size="16" font-weight="600" text-anchor="middle">error</text><path fill="none" stroke="#a6e3a1" stroke-width="3" marker-end="url(#ar-gr)" d="M 1060 215 C 1080 130, 600 100, 220 320"/><path fill="none" stroke="#fab387" stroke-width="3" marker-end="url(#ar-p)" d="M 1060 575 C 1080 660, 600 660, 220 460"/><text x="640" y="660" fill="#fab387" font-size="16" font-weight="600" text-anchor="middle">backoff hasta 5 min</text><text x="640" y="180" fill="#cba6f7" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">PUSH PENDIENTES · PULL NUEVOS · REGISTRAR</text></svg>