<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1280 720"><defs><marker id="ar-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#89b4fa" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ar-mauve" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#cba6f7" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="1280" height="720" fill="#1e1e2e"/><text x="640" y="90" fill="#cdd6f4" font-size="48" font-weight="800" text-anchor="middle">Dos Caminos de Auth</text><text x="640" y="125" fill="#a6adc8" font-size="20" text-anchor="middle">Las máquinas hablan bearer. Los humanos cookies firmadas.</text><g transform="translate(80,180)"><rect width="540" height="500" fill="#89b4fa12" stroke="#89b4fa" stroke-width="2" rx="16"/><text x="270" y="50" fill="#89b4fa" font-size="14" font-weight="700" letter-spacing="4" text-anchor="middle">MÁQUINA</text><text x="270" y="90" fill="#cdd6f4" font-size="28" font-weight="700" text-anchor="middle">Bearer Token</text><g transform="translate(60,140)"><circle cx="22" cy="22" r="22" fill="#89b4fa"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">1</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Manda el header Authorization</text><text x="60" y="42" fill="#a6adc8" font-size="14">en cada request HTTPS</text></g><g transform="translate(60,225)"><circle cx="22" cy="22" r="22" fill="#89b4fa"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">2</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Servidor matchea el token</text><text x="60" y="42" fill="#a6adc8" font-size="14">configurado por env var</text></g><g transform="translate(60,310)"><circle cx="22" cy="22" r="22" fill="#89b4fa"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">3</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Servidor chequea el proyecto</text><text x="60" y="42" fill="#a6adc8" font-size="14">tiene que estar en la allowlist</text></g><g transform="translate(60,395)"><circle cx="22" cy="22" r="22" fill="#a6e3a1"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">4</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">El request pasa</text><text x="60" y="42" fill="#a6e3a1" font-size="14" font-weight="600">200 OK</text></g></g><g transform="translate(660,180)"><rect width="540" height="500" fill="#cba6f712" stroke="#cba6f7" stroke-width="2" rx="16"/><text x="270" y="50" fill="#cba6f7" font-size="14" font-weight="700" letter-spacing="4" text-anchor="middle">HUMANO</text><text x="270" y="90" fill="#cdd6f4" font-size="28" font-weight="700" text-anchor="middle">Cookie de Sesión</text><g transform="translate(60,140)"><circle cx="22" cy="22" r="22" fill="#cba6f7"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">1</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Usuario hace login con token</text><text x="60" y="42" fill="#a6adc8" font-size="14">una vez en el dashboard</text></g><g transform="translate(60,225)"><circle cx="22" cy="22" r="22" fill="#cba6f7"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">2</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Servidor firma una cookie</text><text x="60" y="42" fill="#a6adc8" font-size="14">HMAC-SHA256, válida 8h</text></g><g transform="translate(60,310)"><circle cx="22" cy="22" r="22" fill="#cba6f7"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">3</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Browser manda la cookie</text><text x="60" y="42" fill="#a6adc8" font-size="14">en cada page load</text></g><g transform="translate(60,395)"><circle cx="22" cy="22" r="22" fill="#a6e3a1"/><text x="22" y="29" fill="#1e1e2e" font-size="20" font-weight="800" text-anchor="middle">4</text><text x="60" y="20" fill="#cdd6f4" font-size="20" font-weight="700">Servidor verifica la firma</text><text x="60" y="42" fill="#a6e3a1" font-size="14" font-weight="600">renderea la página</text></g></g></svg>