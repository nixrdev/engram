<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif" viewBox="0 0 1280 720"><defs><marker id="ar-mauve" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#cba6f7" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ar-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#89b4fa" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ar-green" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a6e3a1" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="1280" height="720" fill="#1e1e2e"/><text x="640" y="90" fill="#cdd6f4" font-size="48" font-weight="800" text-anchor="middle">How It Talks</text><text x="640" y="125" fill="#a6adc8" font-size="20" text-anchor="middle">Three surfaces, one binary in the middle.</text><g transform="translate(60,250)"><rect width="280" height="200" fill="#f2cdcd22" stroke="#f2cdcd" stroke-width="2" rx="16"/><text x="140" y="46" fill="#f2cdcd" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">CLIENTS</text><text x="140" y="105" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Agents</text><text x="140" y="142" fill="#a6adc8" font-size="16" text-anchor="middle">Claude · OpenCode</text><text x="140" y="166" fill="#a6adc8" font-size="16" text-anchor="middle">Cursor · Codex …</text></g><g transform="translate(500,250)"><rect width="280" height="200" fill="#fab38722" stroke="#fab387" stroke-width="2" rx="16"/><text x="140" y="46" fill="#fab387" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">LOCAL</text><text x="140" y="105" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Engram</text><text x="140" y="142" fill="#a6adc8" font-size="16" text-anchor="middle">single Go binary</text><text x="140" y="166" fill="#a6adc8" font-size="16" text-anchor="middle">on your machine</text></g><g transform="translate(940,250)"><rect width="280" height="200" fill="#94e2d522" stroke="#94e2d5" stroke-width="2" rx="16"/><text x="140" y="46" fill="#94e2d5" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">REMOTE · OPTIONAL</text><text x="140" y="105" fill="#cdd6f4" font-size="32" font-weight="700" text-anchor="middle">Cloud</text><text x="140" y="142" fill="#a6adc8" font-size="16" text-anchor="middle">replica + dashboard</text><text x="140" y="166" fill="#a6adc8" font-size="16" text-anchor="middle">on your VPS</text></g><line x1="342" x2="498" y1="350" y2="350" stroke="#cba6f7" stroke-width="3" marker-end="url(#ar-mauve)"/><text x="420" y="335" fill="#cba6f7" font-size="16" font-weight="600" text-anchor="middle">MCP stdio</text><line x1="782" x2="938" y1="350" y2="350" stroke="#89b4fa" stroke-width="3" marker-end="url(#ar-blue)"/><text x="860" y="335" fill="#89b4fa" font-size="16" font-weight="600" text-anchor="middle">HTTPS + bearer</text><g transform="translate(500,520)"><rect width="280" height="100" fill="#a6e3a122" stroke="#a6e3a1" stroke-width="2" rx="14"/><text x="140" y="42" fill="#a6e3a1" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">SOURCE OF TRUTH</text><text x="140" y="76" fill="#cdd6f4" font-size="22" font-weight="700" text-anchor="middle">SQLite ~/.engram</text></g><line x1="640" x2="640" y1="450" y2="518" stroke="#a6e3a1" stroke-width="3" marker-end="url(#ar-green)"/><g transform="translate(940,520)"><rect width="280" height="100" fill="#a6e3a122" stroke="#a6e3a1" stroke-width="2" rx="14"/><text x="140" y="42" fill="#a6e3a1" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">REPLICA LOG</text><text x="140" y="76" fill="#cdd6f4" font-size="22" font-weight="700" text-anchor="middle">Postgres</text></g><line x1="1080" x2="1080" y1="450" y2="518" stroke="#a6e3a1" stroke-width="3" marker-end="url(#ar-green)"/></svg>